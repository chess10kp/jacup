name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jaclang
      - run: jac test tests/unit.jac
      - run: jac test tests/integration.jac

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-latest, target: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jaclang pyinstaller
      - run: bash scripts/build_binary.sh "${{ matrix.target }}" dist
      - name: Checksum
        run: |
          cd dist
          python3 -c "import hashlib,sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(1 << 20), b''):
                  h.update(chunk)
          print(h.hexdigest())" "jacup-${{ matrix.target }}" > "jacup-${{ matrix.target }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: jacup-${{ matrix.target }}
          path: dist/jacup-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "jacup $GITHUB_REF_NAME" \
            --generate-notes
